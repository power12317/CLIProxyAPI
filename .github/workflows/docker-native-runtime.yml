name: docker-native-runtime

on:
  push:
    branches:
      - codex/native-model-runtime
    tags:
      - native-runtime-v*
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CONTAINER_IMAGE: ghcr.io/power12317/cliproxyapi-native-runtime

jobs:
  build:
    if: github.ref == 'refs/heads/codex/native-model-runtime' || startsWith(github.ref, 'refs/tags/native-runtime-v')
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate build metadata
        run: |
          echo "VERSION=native-runtime-${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build and push branch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          tags: |
            ${{ env.CONTAINER_IMAGE }}:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=CLIProxyAPI native model runtime test branch
            org.opencontainers.image.revision=${{ github.sha }}

  manifest:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish branch multi-architecture image
        env:
          SOURCE_REVISION: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          docker buildx imagetools create \
            --tag "${CONTAINER_IMAGE}:latest" \
            --tag "${CONTAINER_IMAGE}:sha-${SOURCE_REVISION}" \
            "${CONTAINER_IMAGE}:sha-${SOURCE_REVISION}-amd64" \
            "${CONTAINER_IMAGE}:sha-${SOURCE_REVISION}-arm64"
          if [ -n "$RELEASE_TAG" ]; then
            docker buildx imagetools create \
              --tag "${CONTAINER_IMAGE}:${RELEASE_TAG}" \
              "${CONTAINER_IMAGE}:sha-${SOURCE_REVISION}-amd64" \
              "${CONTAINER_IMAGE}:sha-${SOURCE_REVISION}-arm64"
          fi
