name: docker-codex-runtime

on:
  push:
    branches: [codex/plan-b-managed-auth]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CONTAINER_IMAGE: ghcr.io/power12317/cliproxyapi

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build metadata
        run: echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          build-args: |
            VERSION=codex-runtime
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ env.CONTAINER_IMAGE }}:codex-runtime-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=codex-runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=codex-runtime-${{ matrix.arch }}

  manifest:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish branch and commit tags
        run: |
          docker buildx imagetools create \
            --tag "${CONTAINER_IMAGE}:codex-runtime" \
            --tag "${CONTAINER_IMAGE}:codex-runtime-${GITHUB_SHA}" \
            "${CONTAINER_IMAGE}:codex-runtime-${GITHUB_SHA}-amd64" \
            "${CONTAINER_IMAGE}:codex-runtime-${GITHUB_SHA}-arm64"
