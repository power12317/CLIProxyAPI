name: docker-oailb-borrow

on:
  push:
    tags:
      - 'oailb-borrow/v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-oailb-borrow-${{ github.ref }}
  cancel-in-progress: false

env:
  CONTAINER_IMAGE: ghcr.io/power12317/cliproxyapi-oailb-borrow

jobs:
  build:
    if: github.repository == 'power12317/CLIProxyAPI'
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate branch tag and generate build metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^oailb-borrow/v[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]+$ ]]; then
            echo "Invalid oailb borrow branch tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "VERSION=${GITHUB_REF_NAME#oailb-borrow/}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push branch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          tags: ${{ env.CONTAINER_IMAGE }}:${{ env.VERSION }}-${{ matrix.arch }}

  manifest:
    if: github.repository == 'power12317/CLIProxyAPI'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-architecture branch manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#oailb-borrow/}"
          docker buildx imagetools create \
            --tag "${CONTAINER_IMAGE}:${version}" \
            "${CONTAINER_IMAGE}:${version}-amd64" \
            "${CONTAINER_IMAGE}:${version}-arm64"
