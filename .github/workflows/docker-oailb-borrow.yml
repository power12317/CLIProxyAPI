name: docker-oailb-borrow

on:
  push:
    branches:
      - 'codex/oailb-borrow'
    tags:
      - 'oailb-borrow/v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-oailb-borrow-publish
  cancel-in-progress: false

env:
  CONTAINER_IMAGE: ghcr.io/power12317/cliproxyapi-oailb-borrow

jobs:
  build:
    if: github.repository == 'power12317/CLIProxyAPI'
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate branch or tag and generate build metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_REF_NAME" == "codex/oailb-borrow" ]]; then
            version="sha-${GITHUB_SHA}"
          elif [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" =~ ^oailb-borrow/v[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]+$ ]]; then
            version="${GITHUB_REF_NAME#oailb-borrow/}"
          else
            echo "Invalid oailb borrow publication ref: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          {
            echo "VERSION=${version}"
            echo "COMMIT=$(git rev-parse --short HEAD)"
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push branch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          tags: ${{ env.CONTAINER_IMAGE }}:${{ env.VERSION }}-${{ matrix.arch }}

  manifest:
    if: github.repository == 'power12317/CLIProxyAPI'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-architecture branch manifest
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            version="sha-${GITHUB_SHA}"
          else
            version="${GITHUB_REF_NAME#oailb-borrow/}"
          fi
          docker buildx imagetools create \
            --tag "${CONTAINER_IMAGE}:${version}" \
            "${CONTAINER_IMAGE}:${version}-amd64" \
            "${CONTAINER_IMAGE}:${version}-arm64"

          # Only the current branch head may advance the rolling image.
          branch_head="$(git ls-remote --exit-code origin refs/heads/codex/oailb-borrow | awk '{print $1}')"
          if [[ "$branch_head" != "$(git rev-parse HEAD)" ]]; then
            echo "Preserving latest: this build is not the current borrowing branch head."
            exit 0
          fi
          docker buildx imagetools create \
            --tag "${CONTAINER_IMAGE}:latest" \
            "${CONTAINER_IMAGE}:${version}-amd64" \
            "${CONTAINER_IMAGE}:${version}-arm64"
