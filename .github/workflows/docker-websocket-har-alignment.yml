name: docker-websocket-har-alignment

on:
  push:
    tags:
      - 'websocket-har-alignment-v*'

permissions:
  contents: read
  packages: write

env:
  CONTAINER_IMAGE: ghcr.io/power12317/cliproxyapi-websocket-har-alignment

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate branch tag and generate build metadata
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^websocket-har-alignment-v[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]+$ ]]
          echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push branch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          tags: ${{ env.CONTAINER_IMAGE }}:${{ env.VERSION }}-${{ matrix.arch }}

  manifest:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create branch image manifest
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          docker buildx imagetools create \
            --tag "${CONTAINER_IMAGE}:${VERSION}" \
            "${CONTAINER_IMAGE}:${VERSION}-amd64" \
            "${CONTAINER_IMAGE}:${VERSION}-arm64"
