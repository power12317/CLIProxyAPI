# Apply after the existing CPA Compose file. All images must be built and tested first.
services:
  cli-proxy-api:
    image: ${CPA_RUNTIME_IMAGE:?Set CPA_RUNTIME_IMAGE to the tested CPA Plan B image}
    pull_policy: never
    volumes:
      - codex_worker_a_socket:/run/codex-worker-a:ro

  codex-worker-a:
    image: ${CODEX_RUNTIME_IMAGE:?Set CODEX_RUNTIME_IMAGE to the tested Codex fork image}
    pull_policy: never
    network_mode: "service:cli-proxy-api"
    depends_on:
      cli-proxy-api:
        condition: service_started
        restart: true
    environment:
      CODEX_HOME: /var/lib/codex
    entrypoint: ["/usr/local/bin/codex-app-server"]
    command:
      - "--listen"
      - "unix:///run/codex/cpa.sock"
      - "-c"
      - "cpa_bridge.enabled=true"
      - "-c"
      - 'cpa_bridge.credential_id="worker-a"'
      - "-c"
      - 'cli_auth_credentials_store="file"'
    volumes:
      - codex_worker_a_home:/var/lib/codex
      - codex_worker_a_socket:/run/codex
    # Keep extra_hosts and DNS configuration on cli-proxy-api. Docker container
    # networking inherits its networking files and rejects per-worker overrides.
    restart: unless-stopped

volumes:
  codex_worker_a_home:
  codex_worker_a_socket:
